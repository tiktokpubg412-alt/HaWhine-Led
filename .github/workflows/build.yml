      - name: Fix Java and Kotlin JVM targets
        run: |
          APP_GRADLE=$(find project -path '*/app/build.gradle' -print -quit)

          if [ -z "$APP_GRADLE" ]; then
            echo "app/build.gradle not found"
            exit 1
          fi

          cat >> "$APP_GRADLE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          echo "Updated: $APP_GRADLE"
