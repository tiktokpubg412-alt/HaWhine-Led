
name: Build LED CAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip source.zip

      - name: Build APK
        run: gradle -p LedCarCustomApp assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LED-CAR-APK
          path: LedCarCustomApp/app/build/outputs/apk/debug/app-debug.apk
